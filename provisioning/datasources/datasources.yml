apiVersion: 1

datasources:
  - name: 'Chaski'
    uid: 'duckdbwasm'
    type: 'ubica-chaski-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      memoryLimitMB: 1024
  # Test instances for the data proxy (tests/proxy.spec.ts). The secrets are
  # fixture values for the local nginx in fixtures/nginx.conf, not credentials.
  - name: 'Chaski · proxy bearer'
    uid: 'duckdbwasm-bearer'
    type: 'ubica-chaski-datasource'
    access: proxy
    orgId: 1
    version: 1
    editable: true
    url: http://fixtures/bearer
    jsonData:
      memoryLimitMB: 1024
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Bearer test-token
  - name: 'Chaski · proxy basic'
    uid: 'duckdbwasm-basic'
    type: 'ubica-chaski-datasource'
    access: proxy
    orgId: 1
    version: 1
    editable: true
    url: http://fixtures/basic
    basicAuth: true
    basicAuthUser: test
    jsonData:
      memoryLimitMB: 1024
    secureJsonData:
      basicAuthPassword: test-pass
  - name: 'Chaski · proxy keyed'
    uid: 'duckdbwasm-keyed'
    type: 'ubica-chaski-datasource'
    access: proxy
    orgId: 1
    version: 1
    editable: true
    url: http://fixtures/keyed
    jsonData:
      memoryLimitMB: 1024
      proxyKeyParam: apikey
    secureJsonData:
      proxyKeyValue: test-key
  - name: 'Chaski · proxy wrong token'
    uid: 'duckdbwasm-bearer-wrong'
    type: 'ubica-chaski-datasource'
    access: proxy
    orgId: 1
    version: 1
    editable: true
    url: http://fixtures/bearer
    jsonData:
      memoryLimitMB: 1024
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Bearer wrong-token
