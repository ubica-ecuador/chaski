server {
  listen 80;
  root /usr/share/nginx/html;

  location = /htpasswd {
    deny all;
  }

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin '*' always;
      add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Range' always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Accept-Ranges, ETag' always;
  }

  # Read by Grafana's data proxy, not by the browser: no CORS headers, so a
  # direct read from the page fails, which is what tests/proxy.spec.ts checks.
  location /bearer/ {
    if ($http_authorization != "Bearer test-token") {
      return 401;
    }
    alias /usr/share/nginx/html/;
  }

  location /basic/ {
    auth_basic "fixtures";
    auth_basic_user_file /usr/share/nginx/html/htpasswd;
    alias /usr/share/nginx/html/;
  }

  location /keyed/ {
    if ($arg_apikey != "test-key") {
      return 401;
    }
    alias /usr/share/nginx/html/;
  }
}
