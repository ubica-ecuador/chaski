# Dev Grafanas for the browser DuckDB datasource.
#
# Deliberately NOT using `extends` from .config/docker-compose-base.yaml: Compose
# appends to sequences when merging, so its `ports: [3000:3000]` could not be
# replaced, and :3000 belongs to the kepler-grafana bench.
#
# 12.0.10 is the floor of the supported range and serves plugin assets without
# gzip, which is the worst case phase 0 has to measure.
x-grafana: &grafana
  user: root
  build:
    context: ./.config
    args:
      grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
      grafana_version: ${GRAFANA_VERSION:-12.0.10}
      development: 'false'
      anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
  volumes:
    - ./dist:/var/lib/grafana/plugins/ubica-chaski-datasource
    - ./provisioning:/etc/grafana/provisioning
  depends_on:
    - fixtures

services:
  grafana:
    <<: *grafana
    container_name: 'ubica-chaski-datasource'
    ports:
      - '3005:3000/tcp'
    environment:
      NODE_ENV: development
      GF_LOG_LEVEL: info
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-chaski-datasource
      # Infinity fetches an API server-side, which is how docs/tutorial-earthquakes.md
      # reaches a feed that sends no CORS headers. Nothing else here needs it.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Session tokens rotate every 10 min by default and a long e2e run lands on
      # the login page after that (measured on the kepler bench, 13.x).
      GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: 60

  # Grafana's stock Content Security Policy, to learn what the engine needs
  # under it. Started only with `--profile csp`.
  grafana-csp:
    <<: *grafana
    container_name: 'ubica-chaski-datasource-csp'
    profiles: ['csp']
    ports:
      - '3006:3000/tcp'
    environment:
      NODE_ENV: development
      GF_LOG_LEVEL: info
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-chaski-datasource
      GF_SECURITY_CONTENT_SECURITY_POLICY: 'true'

  # Grafana serving the plugin the way Grafana Cloud does (measured on a Cloud
  # stack, 13.3.0): the frontend comes from a plugin CDN on another origin, and
  # the page carries Cloud's Content Security Policy, which only sets script-src.
  # tests/cdn.spec.ts runs here.
  grafana-cdn:
    <<: *grafana
    container_name: 'ubica-chaski-datasource-cdn'
    ports:
      - '3007:3000/tcp'
    volumes:
      - ./dist:/var/lib/grafana/plugins/ubica-chaski-datasource
      - ./provisioning:/etc/grafana/provisioning
      - ./plugin-cdn/grafana.ini:/etc/grafana/grafana.ini:ro
    depends_on:
      - fixtures
      - plugin-cdn
    environment:
      NODE_ENV: development
      GF_LOG_LEVEL: info
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-chaski-datasource
      GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: 60
      GF_SECURITY_CONTENT_SECURITY_POLICY: 'true'
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE http://localhost:8096/;object-src 'none';base-uri 'self';form-action 'self';frame-ancestors 'none'"

  plugin-cdn:
    image: nginx:1.27-alpine
    container_name: 'ubica-chaski-plugin-cdn'
    ports:
      - '8096:80'
    volumes:
      - ./dist:/usr/share/nginx/dist:ro
      - ./plugin-cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Static files with open CORS, so the `sql` source reads them over httpfs the
  # way it would read a public bucket.
  fixtures:
    image: nginx:1.27-alpine
    container_name: 'ubica-chaski-fixtures'
    ports:
      - '8095:80'
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
