# The plugin CDN for grafana-cdn. Grafana asks for
# <id>/<version>/public/plugins/<id>/<asset>, the layout plugins-cdn.grafana.net
# serves, and like it this answers with open CORS.
server {
  listen 80;

  location ~ ^/ubica-chaski-datasource/[^/]+/public/plugins/ubica-chaski-datasource/(.*)$ {
    alias /usr/share/nginx/dist/$1;
    add_header Access-Control-Allow-Origin '*' always;
  }
}
