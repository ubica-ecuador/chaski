# The plugin CDN for grafana-cdn. Grafana asks for
# <id>/<version>/public/plugins/<id>/<asset>, the layout plugins-cdn.grafana.net
# serves, and like it this answers with open CORS. The id is the app's; its
# nested plugins are paths inside it (plugins/datasource/...).
server {
  listen 80;

  location ~ ^/ubica-chaski-app/[^/]+/public/plugins/ubica-chaski-app/(.*)$ {
    alias /usr/share/nginx/dist/$1;
    add_header Access-Control-Allow-Origin '*' always;
  }
}
