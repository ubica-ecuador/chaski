# Serves this plugin's frontend the way Grafana Cloud does: from a plugin CDN on
# another origin. On Cloud that is plugins-cdn.grafana.net, and /public/plugins/<id>/
# on the stack answers 307 to it. Here it is the plugin-cdn service.
#
# These keys are absent from defaults.ini, and GF_* variables only override keys
# that exist there, so this has to be a file.
[plugins]
cdn_base_url = http://localhost:8096

[plugin.ubica-chaski-datasource]
cdn = true
