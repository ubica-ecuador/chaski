# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # For `attestation: true` below: `id-token` mints the workflow's OIDC
      # identity, `attestations` stores the provenance record. The build fails
      # without them instead of skipping the attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A plugin that was never published cannot be signed: the catalog review
      # grants the signature level. Until then GRAFANA_ACCESS_POLICY_TOKEN is
      # unset, the action skips its sign step, and the unsigned zip plus its
      # sha1 on the draft release are what the submission form asks for. Once
      # the level is granted, adding the secret signs the next tag with no
      # change here.
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # The catalog checks provenance on submission ("No provenance
          # attestation" otherwise), and the local validator can't see it.
          attestation: true
          # use_changelog_generator stays off: it commits a generated
          # changelog over the hand-written CHANGELOG.md.
